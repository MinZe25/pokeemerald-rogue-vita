name: Vita release

# Builds the PS Vita VPK and publishes it as a GitHub release.
#   - push a tag named vita-v* (e.g. `git tag vita-v1.0 && git push vita vita-v1.0`), or
#   - run it by hand from the Actions tab (Run workflow) and type a tag name.
on:
  push:
    tags:
      - 'vita-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. vita-v1.0)'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  vpk:
    runs-on: ubuntu-22.04
    env:
      VITASDK: /home/runner/vitasdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev libelf-dev python3 cmake curl git xz-utils bzip2 wget unzip

      - name: Cache VitaSDK
        id: vitasdk-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/vitasdk
          key: vitasdk-${{ runner.os }}-sdl2-v2

      - name: Install VitaSDK + SDL2
        if: steps.vitasdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/vitasdk/vdpm /tmp/vdpm
          /tmp/vdpm/bootstrap-vitasdk.sh
          export PATH=$VITASDK/bin:$PATH
          # the SDK ships its own package manager; SDL2 is the only package the port needs
          yes | vdpm install sdl2

      - name: Add VitaSDK to PATH
        run: echo "$VITASDK/bin" >> "$GITHUB_PATH"

      - name: Download poryscript
        run: ./init_deps.sh

      - name: Build tools
        run: make tools -j$(nproc)

      - name: Build VPK
        run: make -j$(nproc) PORTABLE=1 TARGET_OS=VITA RELEASE=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald_rogue-vita
          path: pokeemerald_rogue.vpk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Emerald Rogue for PS Vita ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          files: pokeemerald_rogue.vpk
          body: |
            Native PS Vita port of Pokémon Emerald Rogue (not an emulator).

            **Requires your own ROM of Pokémon Emerald Rogue EX v2.2.1** (the official 2.2.1 patch applied to your Pokémon Emerald ROM; 32 MB `.gba`, SHA-1 `7600af1fe08444c850c3c1227fd7dfd81336ae8e`). The VPK contains no game data: graphics, sounds and maps are loaded from that ROM at startup.

            **Install:** install `pokeemerald_rogue.vpk` with VitaShell and copy your `.gba` into `ux0:data/pokeemerald_rogue/`.
            Saves live in the same folder. Updating over an existing install keeps them.
            If the bubble or LiveArea art does not change after an update, delete the app and install it again (saves are kept).

            **Menu:** Square (remappable) or tap the touch screen: save states, scaling, filter, fast forward, button remapping, save files, save anywhere.

            Built from ${{ github.sha }}.
